services:
  postgres:
    image: postgres:16-alpine
    container_name: lumini-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lumini-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      # First-boot admin (Keycloak >= 26 syntax). Falls back to legacy vars
      # for older releases via the second pair, harmless on 26.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # HTTP-only for local; production must terminate TLS at the edge
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      # Health & metrics
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Logging
      KC_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      # Mounted read-only — Keycloak imports this on first boot when
      # `--import-realm` is passed. Re-importing on later boots is a no-op
      # unless you delete the realm in the admin console first.
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  audit-dashboard:
    image: nginx:1.27-alpine
    container_name: lumini-audit-dashboard
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./audit-dashboard:/usr/share/nginx/html:ro
      - ./audit-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - keycloak

volumes:
  keycloak-postgres:
    name: lumini-keycloak-postgres
